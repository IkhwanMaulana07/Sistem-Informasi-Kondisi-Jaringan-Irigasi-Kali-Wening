<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="350" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M 120 120 Q 150 90 180 120 Q 210 100 240 120 Q 260 140 230 150 L 130 150 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M 520 80 Q 560 50 600 80 Q 640 60 670 90 Q 690 110 660 120 L 530 120 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Distant Mountains -->
  <polygon points="0,320 180,180 380,320" fill="#047857" opacity="0.4"/>
  <polygon points="250,320 460,160 680,320" fill="#065f46" opacity="0.5"/>
  <polygon points="500,320 680,190 800,320" fill="#047857" opacity="0.4"/>

  <!-- Rice Field Banks (Greenery) -->
  <polygon points="0,300 800,300 800,420 0,420" fill="url(#hillGrad)"/>

  <!-- Main Irrigation Canal Water Body -->
  <polygon points="120,400 680,400 780,600 20,600" fill="url(#waterGrad)"/>

  <!-- Water Surface Reflections & Flow Lines -->
  <path d="M 180 430 Q 400 440 620 430" stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 150 480 Q 400 495 650 480" stroke="#bae6fd" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 100 540 Q 400 560 700 540" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Concrete Irrigation Weir Structure / Bangunan Bagi Sadap -->
  <!-- Left Wing Wall -->
  <polygon points="60,330 180,330 220,490 100,520" fill="url(#concreteGrad)"/>
  <!-- Right Wing Wall -->
  <polygon points="620,330 740,330 700,520 580,490" fill="url(#concreteGrad)"/>

  <!-- Center Bridge Pier & Beam -->
  <rect x="180" y="310" width="440" height="40" rx="4" fill="url(#concreteGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="220" y="270" width="360" height="40" rx="2" fill="#64748b" opacity="0.9"/>
  <!-- Safety Railing -->
  <line x1="200" y1="280" x2="600" y2="280" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="200" y1="295" x2="600" y2="295" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="250" y1="270" x2="250" y2="310" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="350" y1="270" x2="350" y2="310" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="450" y1="270" x2="450" y2="310" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="550" y1="270" x2="550" y2="310" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Central Pillars -->
  <rect x="280" y="340" width="40" height="90" fill="url(#concreteGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="480" y="340" width="40" height="90" fill="url(#concreteGrad)" stroke="#475569" stroke-width="2"/>

  <!-- Sluice Gates (Steel Gates) -->
  <rect x="330" y="350" width="140" height="65" fill="url(#gateGrad)" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Gate Lift Spindles -->
  <rect x="395" y="240" width="10" height="110" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <circle cx="400" cy="235" r="16" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>

  <!-- Water Flowing Out of Gate (Whitewater / Foam) -->
  <path d="M 320 415 Q 400 435 480 415 L 510 460 Q 400 480 290 460 Z" fill="#f8fafc" opacity="0.85"/>
  <circle cx="360" cy="435" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="440" cy="440" r="10" fill="#ffffff" opacity="0.9"/>
  <circle cx="400" cy="450" r="12" fill="#ffffff" opacity="0.9"/>

  <!-- Vegetation Details / Bush on Banks -->
  <ellipse cx="80" cy="360" rx="40" ry="25" fill="#15803d"/>
  <ellipse cx="120" cy="380" rx="35" ry="20" fill="#166534"/>
  <ellipse cx="720" cy="360" rx="40" ry="25" fill="#15803d"/>
  <ellipse cx="680" cy="380" rx="35" ry="20" fill="#166534"/>
</svg>
