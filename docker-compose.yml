services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: irigasi
      POSTGRES_PASSWORD: irigasi
      POSTGRES_DB: irigasi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irigasi -d irigasi"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      API_CONTRACT_VERSION: "1.2"
      DATABASE_URL: postgresql+psycopg://irigasi:irigasi@db:5432/irigasi
      DATA_DIR: /app/data
      INITIAL_ASSET_FILE: aset_bangunan.csv
      INITIAL_REPORT_FILE: laporan_penelusuran.xlsx
      CANAL_FILE: saluran.geojson
      PLOT_FILE: petak_tersier.geojson
      SUPPLEMENTAL_REPORT_FILE: laporan_susulan.xlsx
      WEB_ORIGIN: http://localhost:8080
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      INTERNAL_API_URL: http://api:8000
      PORT: 8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
